name: Supabase keep-alive

# El plan gratis de Supabase pausa el proyecto tras ~7 días sin actividad,
# y entonces nadie puede entrar en la app. Esto hace una consulta real a la
# base de datos cada 2 días. Si Supabase no responde (proyecto pausado o
# borrado), el job falla y GitHub te avisa por email.
on:
  schedule:
    - cron: "17 6 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta a la base de datos
        env:
          URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL || 'https://fvskktohsrizlyqxgikm.supabase.co' }}
          KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY || 'sb_publishable_FzoQtVT5cm3UUq8DsvYB6Q_yehYSmP4' }}
        run: |
          code=$(curl -s -m 30 -o /dev/null -w "%{http_code}" \
            "$URL/rest/v1/progress?select=key&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" || true)
          echo "HTTP $code"
          # 200 o 401 (sin sesión, RLS) = la base de datos respondió: proyecto activo.
          case "$code" in
            200|401) echo "Supabase activo." ;;
            *) echo "::error::Supabase no responde (HTTP $code). Puede estar pausado: entra en supabase.com y pulsa «Restore project»."; exit 1 ;;
          esac
