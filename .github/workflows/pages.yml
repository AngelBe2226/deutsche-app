name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no cancela uno en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (estático, base de Pages)
        working-directory: frontend
        env:
          VITE_STATIC: "1"
          BASE_PATH: "/deutsche-app/"
          # Login + progreso por usuario (Supabase). Ambos valores son
          # públicos por diseño (la clave publishable acaba en el bundle de
          # la web); la seguridad la ponen RLS y el registro cerrado.
          # Una variable/secret SUPABASE_URL o SUPABASE_ANON_KEY en GitHub
          # tiene prioridad sobre estos valores.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL || 'https://fvskktohsrizlyqxgikm.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY || 'sb_publishable_FzoQtVT5cm3UUq8DsvYB6Q_yehYSmP4' }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
