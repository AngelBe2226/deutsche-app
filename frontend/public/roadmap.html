<title>Ruta del Método Alemán</title>
<style id="css">
@import url("https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap");

:root{
  color-scheme:light;
  --bg:#F7F7F8; --surface:#FFFFFF; --surface-2:#F4F4F6; --surface-3:#ECECF0;
  --ink:#0F0F14; --muted:#4B4B57; --faint:#8B8B97;
  --line:#E7E7EC; --line-strong:#D6D6DE;
  --accent:#5B4FE9; --accent-ink:#4338CA; --accent-soft:#EFEDFE; --accent-line:#D9D5FC;
  --grad:linear-gradient(135deg,#6366F1 0%,#8B5CF6 45%,#EC4899 100%);
  --grad-soft:linear-gradient(135deg,rgba(99,102,241,.10),rgba(139,92,246,.08) 45%,rgba(236,72,153,.08));
  --glow-1:rgba(99,102,241,.22); --glow-2:rgba(236,72,153,.16);
  --done:#15803D; --done-soft:#ECFDF3; --done-line:#BBF7D0;
  --gap:#DC2626;
  --shadow-xs:0 1px 2px rgba(16,16,24,.04);
  --shadow:0 1px 2px rgba(16,16,24,.04),0 1px 3px rgba(16,16,24,.04);
  --shadow-hover:0 1px 2px rgba(16,16,24,.04),0 8px 24px -8px rgba(16,16,24,.12);
  --ring:0 0 0 4px rgba(91,79,233,.16);
  --radius:18px;
  --mono:"Geist Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B0B0F; --surface:#131318; --surface-2:#1A1A21; --surface-3:#23232C;
    --ink:#F4F4F6; --muted:#B4B4C0; --faint:#7C7C89;
    --line:#26262F; --line-strong:#34343F;
    --accent:#8B83FF; --accent-ink:#A5A0FF; --accent-soft:rgba(139,131,255,.12); --accent-line:rgba(139,131,255,.30);
    --grad-soft:linear-gradient(135deg,rgba(99,102,241,.16),rgba(139,92,246,.12) 45%,rgba(236,72,153,.10));
    --glow-1:rgba(99,102,241,.30); --glow-2:rgba(236,72,153,.18);
    --done:#4ADE80; --done-soft:rgba(74,222,128,.10); --done-line:rgba(74,222,128,.30);
    --gap:#F87171;
    --shadow-xs:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 1px 2px rgba(0,0,0,.4);
    --shadow-hover:0 1px 2px rgba(0,0,0,.4),0 8px 24px -8px rgba(0,0,0,.6);
    --ring:0 0 0 4px rgba(139,131,255,.22);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B0B0F; --surface:#131318; --surface-2:#1A1A21; --surface-3:#23232C;
  --ink:#F4F4F6; --muted:#B4B4C0; --faint:#7C7C89;
  --line:#26262F; --line-strong:#34343F;
  --accent:#8B83FF; --accent-ink:#A5A0FF; --accent-soft:rgba(139,131,255,.12); --accent-line:rgba(139,131,255,.30);
  --grad-soft:linear-gradient(135deg,rgba(99,102,241,.16),rgba(139,92,246,.12) 45%,rgba(236,72,153,.10));
  --glow-1:rgba(99,102,241,.30); --glow-2:rgba(236,72,153,.18);
  --done:#4ADE80; --done-soft:rgba(74,222,128,.10); --done-line:rgba(74,222,128,.30);
  --gap:#F87171;
  --shadow-xs:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-hover:0 1px 2px rgba(0,0,0,.4),0 8px 24px -8px rgba(0,0,0,.6);
  --ring:0 0 0 4px rgba(139,131,255,.22);
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:clip}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Geist",system-ui,-apple-system,Segoe UI,sans-serif;
  font-size:15px; line-height:1.6; letter-spacing:-.006em;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(139,92,246,.22)}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:8px}

.wrap{position:relative;isolation:isolate;max-width:880px;margin:0 auto;padding:0 20px}
.wrap::before{
  content:"";position:absolute;z-index:-1;inset:-5rem -6rem auto;height:22rem;pointer-events:none;
  background:radial-gradient(40% 60% at 20% 30%,var(--glow-1),transparent 70%),radial-gradient(35% 55% at 75% 20%,var(--glow-2),transparent 70%);
  filter:blur(20px);
}
main{padding-block:8px 64px}

/* top bar */
.top{
  position:sticky; top:0; z-index:20;
  background:color-mix(in srgb,var(--bg) 78%,transparent);
  backdrop-filter:saturate(180%) blur(14px); -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);
}
.top .row{max-width:880px;margin:0 auto;padding:10px 20px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;color:inherit;text-decoration:none}
.brand::before{
  content:"DE";flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:10px;
  background:var(--grad);color:#fff;font-weight:700;font-size:12px;letter-spacing:.02em;
  box-shadow:0 6px 16px -6px rgba(139,92,246,.6),inset 0 1px 0 rgba(255,255,255,.25);
}
.brand .bt{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brand b{font-weight:650;font-size:15px;letter-spacing:-.02em}
.brand .eyebrow{font-size:11.5px;color:var(--faint)}
.progwrap{display:flex;align-items:center;gap:10px}
.count{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.count b{color:var(--ink);font-weight:600}
.bar{width:120px;height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--grad);border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.themebtn,.backlink{
  border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:9px;height:34px;cursor:pointer;
  font:inherit;font-size:13px;display:inline-grid;place-items:center;flex:none;text-decoration:none;
  transition:border-color .15s,color .15s;
}
.themebtn{width:34px;font-size:15px}
.backlink{padding:0 12px;font-weight:500}
.themebtn:hover,.backlink:hover{color:var(--ink);border-color:var(--line-strong)}

/* section nav */
nav.jump{max-width:880px;margin:0 auto;padding:2px 20px 10px;display:flex;gap:6px;flex-wrap:wrap}
nav.jump a{font-size:12.5px;font-weight:500;color:var(--muted);text-decoration:none;padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow-xs);transition:.15s}
nav.jump a:hover{color:var(--accent-ink);border-color:var(--accent-line);background:var(--accent-soft)}

/* hero / intro */
.lede{padding-block:40px 8px}
.lede h1{font-weight:700;font-size:clamp(30px,4.6vw,44px);line-height:1.06;letter-spacing:-.035em;margin:0 0 14px;text-wrap:balance}
.lede p{color:var(--muted);max-width:66ch;margin:0;font-size:16.5px;line-height:1.7;text-wrap:pretty}
.lede .stamp{
  display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:550;color:var(--muted);
  padding:4px 12px 4px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-xs);margin-bottom:16px;
}
.lede .stamp::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--grad);box-shadow:0 0 0 3px var(--accent-soft)}

/* diagnosis */
.diag{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--shadow)}
.diag h2{font-weight:650;font-size:16px;letter-spacing:-.02em;margin:0 0 4px}
.diag p.sub{margin:0 0 20px;color:var(--faint);font-size:13.5px}
.cefr{display:flex;gap:10px;align-items:flex-end;height:140px;padding-top:8px}
.cefr .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;justify-content:flex-end;height:100%}
.cefr .col .track{width:100%;flex:1;display:flex;align-items:flex-end;background:var(--surface-2);border-radius:10px;overflow:hidden}
.cefr .col .fill{width:100%;border-radius:10px;min-height:3px;background:linear-gradient(180deg,#EC4899 -40%,#8B5CF6 35%,#6366F1);transition:height .6s cubic-bezier(.2,.8,.2,1)}
.cefr .col.zero .fill{background:repeating-linear-gradient(45deg,var(--surface-3),var(--surface-3) 5px,transparent 5px,transparent 10px)}
.cefr .col .lv{font-family:var(--mono);font-size:12px;font-weight:600}
.cefr .col .num{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums;margin-top:-6px}
.cefr .col.zero .num{color:var(--gap)}
.diag .legend{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;gap:18px;flex-wrap:wrap}
.diag .legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:3px;flex:none}

/* group section */
section.grp{margin-top:48px;scroll-margin-top:120px}
.grp>header{display:flex;align-items:center;gap:12px;margin-bottom:4px;flex-wrap:wrap}
.grp>header .n{font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--accent-ink);background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:8px;padding:2px 8px}
.grp>header h2{font-weight:700;font-size:23px;margin:0;letter-spacing:-.03em}
.grp>header .gcount{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto;padding:3px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.grp>p.intro{color:var(--muted);margin:8px 0 20px;max-width:66ch;font-size:14.5px}

/* phase card */
.phase{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 8px;margin-bottom:14px;box-shadow:var(--shadow);transition:box-shadow .25s}
.phase:hover{box-shadow:var(--shadow-hover)}
.phase .ph-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.phase .badge{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:700;color:#fff;background:var(--grad);box-shadow:0 6px 14px -8px rgba(139,92,246,.7)}
.phase .ph-title{flex:1;min-width:0}
.phase .ph-title b{font-size:16px;font-weight:650;letter-spacing:-.02em;display:block;line-height:1.3}
.phase .ph-title .goal{color:var(--muted);font-size:13.5px;margin-top:2px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.02em;padding:3px 8px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted)}
.tag.imp{color:var(--accent-ink);border-color:var(--accent-line);background:var(--accent-soft)}

/* item / checkbox */
ul.items{list-style:none;margin:0;padding:0}
.item{display:flex;gap:12px;align-items:flex-start;padding:11px 8px;margin:0 -8px;border-top:1px solid var(--line);border-radius:10px;cursor:pointer;transition:background .12s}
.item:hover{background:var(--surface-2)}
.box{flex:none;width:20px;height:20px;margin-top:1px;border:1.5px solid var(--line-strong);border-radius:6px;background:var(--surface);display:grid;place-items:center;transition:.15s}
.item:hover .box{border-color:var(--accent)}
.box svg{width:12px;height:12px;stroke:#fff;stroke-width:3;fill:none;opacity:0;transform:scale(.5);transition:.15s;stroke-linecap:round;stroke-linejoin:round}
.item.done .box,.vcard.done .box{background:var(--done);border-color:var(--done)}
.item.done .box svg,.vcard.done .box svg{opacity:1;transform:scale(1)}
.item .txt{flex:1;min-width:0}
.item .txt .t{font-size:14.5px;line-height:1.45}
.item.done .txt .t{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.item .txt .note{font-size:12.5px;color:var(--faint);margin-top:2px}

/* plain checklist card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:6px 16px}
.card .item:first-child{border-top:none}

/* vertical grid */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px;display:flex;gap:11px;align-items:flex-start;cursor:pointer;transition:border-color .2s,box-shadow .2s,transform .2s}
.vcard:hover{border-color:var(--accent-line);box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.vcard.done{background:linear-gradient(var(--done-soft),var(--done-soft)),var(--surface);border-color:var(--done-line)}
.vcard .txt .t{font-weight:600;font-size:14.5px;letter-spacing:-.01em}
.vcard.done .txt .t{text-decoration:line-through;text-decoration-color:var(--done-line);color:var(--muted)}
.vcard .txt .note{font-size:12.5px;color:var(--faint);margin-top:3px;line-height:1.45}

footer{margin-top:56px;padding:24px 20px;border-top:1px solid var(--line);color:var(--faint);font-size:12.5px;text-align:center;display:flex;flex-direction:column;gap:6px}
footer .save{color:var(--muted)}
footer .save b{color:var(--ink);font-weight:600}
a.ext{color:var(--accent-ink)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
@media (max-width:560px){
  .bar{width:72px}
  .cefr{height:110px;gap:6px}
  .brand .eyebrow{display:none}
  nav.jump{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  nav.jump a{white-space:nowrap}
  .wrap::before{inset:-4rem -2rem auto}
}
</style>

        {"id":"c-fvg","t":"Funktionsverbgefüge","note":"in Frage stellen, zur Verfügung stellen, Anwendung finden…"},
        {"id":"c-partizip","t":"Partizipial- y erweiterte Attribute","note":"der gestern angekommene Gast"},
        {"id":"c-konnekt","t":"Konnektoren avanzados y Präpositionaladverbien","note":"dessen ungeachtet, insofern, hierbei"},
        {"id":"c-partikel","t":"Modalpartikeln","note":"doch, ja, mal, halt, eben, wohl — el matiz que separa B2 de nativo"},
        {"id":"c-register","t":"Registro","note":"mismo mensaje en formal / informal / burocrático; ironía; eufemismos"},
        {"id":"c-texttypen","t":"Tipos de texto productivos","note":"Erörterung, Zusammenfassung, formeller Brief, Grafikbeschreibung"},
        {"id":"c-kollok","t":"Colocaciones y sinonimia fina","note":"a escala de lo que hoy insinúa el bloque 17"},
        {"id":"c-auth","t":"Textos auténticos largos","note":"prensa, ensayo, literatura, con análisis de estilo"}
      ]
    },
    {
      "id":"infra", "kind":"checklist", "title":"Infraestructura de método",
      "intro":"Lo que convierte un índice en un método: progresión, memoria y evaluación.",
      "items":[
        {"id":"i-placement","t":"Test de nivel / colocación","note":"te dice por dónde empezar"},
        {"id":"i-srs","t":"Repaso espaciado (SRS)","note":"reutilizando el progreso en SQLite"},
        {"id":"i-ruta","t":"Ruta de aprendizaje con progresión y desbloqueo"},
        {"id":"i-errores","t":"Registro de errores → repaso dirigido"},
        {"id":"i-examenes","t":"Módulos de preparación de exámenes","note":"formatos reales, simulacros cronometrados"},
        {"id":"i-audio","t":"Pipeline de audio (TTS) en todo el contenido"},
        {"id":"i-buscador","t":"Buscador global + etiquetado por tema / nivel / destreza"}
      ]
    }
  ]
}
</script>
<script id="progress-state" type="application/json">{}</script>

<script id="boot">
(function(){
  "use strict";
  var TITLE = "Ruta del Método Alemán";
  var LS_KEY = "german-roadmap-progress-v1";
  var DATA, STATE = {}, allIds = [], canPublish = false, artifactNS = null, pubTimer = null;

  try { DATA = JSON.parse(document.getElementById("roadmap-data").textContent); }
  catch(e){ DATA = {groups:[],current:{}}; }

  var serverState = {};
  try { serverState = JSON.parse(document.getElementById("progress-state").textContent) || {}; } catch(e){}
  var localState = {};
  try { localState = JSON.parse(localStorage.getItem(LS_KEY) || "{}") || {}; } catch(e){}
  // Server (shared) is the base; local per-viewer overrides layer on top.
  STATE = Object.assign({}, serverState, localState);

  // collect every checkable id
  DATA.groups.forEach(function(g){
    if(g.kind === "phases"){ g.phases.forEach(function(p){ p.items.forEach(function(it){ allIds.push(it.id); }); }); }
    else { g.items.forEach(function(it){ allIds.push(it.id); }); }
  });

  function esc(s){ return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];}); }
  function el(tag, cls, html){ var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }
  var CHECK = '<svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"></polyline></svg>';

  function doneCount(){ var n=0; allIds.forEach(function(id){ if(STATE[id]) n++; }); return n; }

  function render(){
    var app = document.getElementById("app");
    app.textContent = "";

    // top bar
    var top = el("div","top");
    var row = el("div","row");
    var brand = el("div","brand");
    brand.innerHTML = '<span class="bt"><b>'+esc(TITLE)+'</b><span class="eyebrow">Índice de Alemán · A1–C2</span></span>';
    var pw = el("div","progwrap");
    pw.innerHTML = '<span class="count"><b id="cnum">0</b> / '+allIds.length+' hechos</span>'
      + '<div class="bar"><i id="cbar"></i></div>'
      + '<a class="backlink" href="/">← Índice</a>'
      + '<button class="themebtn" id="tbtn" title="Cambiar tema" aria-label="Cambiar tema">◐</button>';
    row.appendChild(brand); row.appendChild(pw); top.appendChild(row);

    // jump nav
    var nav = el("nav","jump");
    DATA.groups.forEach(function(g){
      var a = el("a"); a.href = "#"+g.id; a.textContent = g.title; nav.appendChild(a);
    });
    top.appendChild(nav);
    app.appendChild(top);

    var wrap = el("div","wrap");
    var main = el("main");

    // lede + diagnosis
    var lede = el("div","lede");
    lede.innerHTML = '<div class="stamp">Hoja de ruta · act. '+esc(DATA.updated||"")+'</div>'
      + '<h1>De índice de gramática a método completo</h1>'
      + '<p>Hoy la app enseña gramática con frases sueltas, tests, glosario y flashcards, y cubre A1–B1 con solidez. Esta ruta marca lo que falta para llegar a un método A1–C2 con las cuatro destrezas, vocabulario temático y niveles altos. Marca cada punto conforme lo construimos: el progreso se guarda y se sincroniza entre tus equipos.</p>';
    main.appendChild(lede);
    main.appendChild(buildDiag());

    DATA.groups.forEach(function(g){ main.appendChild(buildGroup(g)); });

    var foot = el("footer");
    foot.innerHTML = '<div class="save" id="savenote">Guardando el progreso…</div>'
      + '<div>Índice de Alemán · plan de contenido A1–C2 · redactado por Claude; conviene validar C1/C2 y las verticales con un profe nativo antes de producir en masa.</div>';
    main.appendChild(foot);

    wrap.appendChild(main);
    app.appendChild(wrap);

    document.getElementById("tbtn").addEventListener("click", toggleTheme);
    updateProgress();
    updateSaveNote();
  }

  function buildDiag(){
    var c = DATA.current || {};
    var order = ["A1","A2","B1","B2","C1","C2"];
    var max = 0; order.forEach(function(k){ if((c[k]||0)>max) max=c[k]||0; });
    var diag = el("div","diag");
    diag.id = "estado";
    var cols = order.map(function(k){
      var v = c[k]||0; var h = max? Math.round(v/max*100):0;
      var zero = v===0? " zero":"";
      return '<div class="col'+zero+'"><div class="track"><div class="fill" style="height:'+(v===0?4:Math.max(h,6))+'%"></div></div>'
        + '<div class="lv">'+k+'</div><div class="num">'+v+'</div></div>';
    }).join("");
    diag.innerHTML = '<h2>Estado actual · cobertura por nivel</h2>'
      + '<p class="sub">Secciones de contenido existentes hoy. B2 apenas empieza; C1 y C2 no existen.</p>'
      + '<div class="cefr">'+cols+'</div>'
      + '<div class="legend">'
        + '<span><i class="dot" style="background:var(--grad)"></i> secciones existentes</span>'
        + '<span><i class="dot" style="background:transparent;border:1px dashed var(--line-strong)"></i> nivel sin contenido</span>'
      + '</div>';
    return diag;
  }

  function buildGroup(g){
    var sec = el("section","grp"); sec.id = g.id;
    var ids = g.kind==="phases" ? [].concat.apply([], g.phases.map(function(p){return p.items.map(function(i){return i.id;});})) : g.items.map(function(i){return i.id;});
    var done = ids.filter(function(id){return STATE[id];}).length;
    var head = el("header");
    head.innerHTML = '<span class="n">'+(g.kind==="phases"?"07 fases":ids.length+" ítems")+'</span>'
      + '<h2>'+esc(g.title)+'</h2>'
      + '<span class="gcount" data-gc="'+g.id+'">'+done+'/'+ids.length+'</span>';
    sec.appendChild(head);
    if(g.intro){ var ip=el("p","intro"); ip.textContent=g.intro; sec.appendChild(ip); }

    if(g.kind==="phases"){
      g.phases.forEach(function(p){ sec.appendChild(buildPhase(p)); });
    } else if(g.kind==="verticals"){
      var grid = el("div","vgrid");
      g.items.forEach(function(it){ grid.appendChild(buildVCard(it)); });
      sec.appendChild(grid);
    } else {
      var card = el("div","card"); var ul = el("ul","items");
      g.items.forEach(function(it){ ul.appendChild(buildItem(it)); });
      card.appendChild(ul); sec.appendChild(card);
    }
    return sec;
  }

  function buildPhase(p){
    var ph = el("div","phase");
    var head = el("div","ph-head");
    head.innerHTML = '<div class="badge">'+p.n+'</div>'
      + '<div class="ph-title"><b>'+esc(p.name)+'</b><div class="goal">'+esc(p.goal)+'</div>'
      + '<div class="tags"><span class="tag imp">'+esc(p.impact)+'</span><span class="tag">'+esc(p.effort)+'</span></div></div>';
    ph.appendChild(head);
    var ul = el("ul","items");
    p.items.forEach(function(it){ ul.appendChild(buildItem(it)); });
    ph.appendChild(ul);
    return ph;
  }

  function buildItem(it){
    var li = el("div","item"+(STATE[it.id]?" done":""));
    li.setAttribute("data-id", it.id);
    li.setAttribute("role","button");
    li.setAttribute("tabindex","0");
    li.setAttribute("aria-pressed", STATE[it.id]?"true":"false");
    var note = it.note? '<div class="note">'+esc(it.note)+'</div>':'';
    li.innerHTML = '<span class="box">'+CHECK+'</span><div class="txt"><div class="t">'+esc(it.t)+'</div>'+note+'</div>';
    bindToggle(li, it.id);
    return li;
  }

  function buildVCard(it){
    var d = el("div","vcard"+(STATE[it.id]?" done":""));
    d.setAttribute("data-id", it.id);
    d.setAttribute("role","button");
    d.setAttribute("tabindex","0");
    d.setAttribute("aria-pressed", STATE[it.id]?"true":"false");
    d.innerHTML = '<span class="box">'+CHECK+'</span><div class="txt"><div class="t">'+esc(it.t)+'</div><div class="note">'+esc(it.note||"")+'</div></div>';
    bindToggle(d, it.id);
    return d;
  }

  function bindToggle(node, id){
    function fire(e){ e.preventDefault(); toggle(id); }
    node.addEventListener("click", fire);
    node.addEventListener("keydown", function(e){ if(e.key===" "||e.key==="Enter") fire(e); });
  }

  function toggle(id){
    STATE[id] = !STATE[id];
    // reflect on every node with this id (an id shows once, but stay safe)
    document.querySelectorAll('[data-id="'+id+'"]').forEach(function(node){
      var on = !!STATE[id];
      node.classList.toggle("done", on);
      node.setAttribute("aria-pressed", on?"true":"false");
    });
    saveLocal();
    updateProgress();
    schedulePublish();
  }

  function updateProgress(){
    var n = doneCount();
    var cn = document.getElementById("cnum"); if(cn) cn.textContent = n;
    var cb = document.getElementById("cbar"); if(cb) cb.style.width = (allIds.length? (n/allIds.length*100):0)+"%";
    // per-group counters
    DATA.groups.forEach(function(g){
      var ids = g.kind==="phases" ? [].concat.apply([], g.phases.map(function(p){return p.items.map(function(i){return i.id;});})) : g.items.map(function(i){return i.id;});
      var done = ids.filter(function(id){return STATE[id];}).length;
      var gc = document.querySelector('[data-gc="'+g.id+'"]'); if(gc) gc.textContent = done+"/"+ids.length;
    });
  }

  function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(STATE)); }catch(e){} }

  function updateSaveNote(){
    var n = document.getElementById("savenote"); if(!n) return;
    if(canPublish) n.innerHTML = 'Progreso <b>guardado y sincronizado</b> entre tus equipos.';
    else n.innerHTML = 'Progreso guardado en <b>este navegador</b>.';
  }

  // ---- shared persistence via the artifact capability ----
  function buildDoc(state){
    var css = document.getElementById("css").textContent;
    var data = document.getElementById("roadmap-data").textContent;
    var boot = document.getElementById("boot").textContent;
    return '<!doctype html>\n<html lang="es">\n<head>\n'
      + '<meta charset="utf-8">\n'
      + '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'
      + '<title>'+TITLE+'</title>\n'
      + '<style id="css">'+css+'</style>\n'
      + '</head>\n<body>\n'
      + '<div id="app"></div>\n'
      + '<script id="roadmap-data" type="application/json">'+data+'<\/script>\n'
      + '<script id="progress-state" type="application/json">'+JSON.stringify(state)+'<\/script>\n'
      + '<script id="boot">'+boot+'<\/script>\n'
      + '</body>\n</html>';
  }

  function schedulePublish(){
    if(!canPublish || !artifactNS) return;
    if(pubTimer) clearTimeout(pubTimer);
    pubTimer = setTimeout(function(){
      try {
        var r = artifactNS.publish(buildDoc(STATE));
        if(r && typeof r.then==="function") r.catch(function(){ /* conflict/read-only: local copy stands */ });
      } catch(e){}
    }, 650);
  }

  if (window.claude && typeof window.claude.use === "function"){
    window.claude.use("artifact").then(function(ns){
      if(ns){ artifactNS = ns; canPublish = true; updateSaveNote(); }
    }).catch(function(){});
  }

  // ---- theme toggle (per-viewer convenience) ----
  function currentTheme(){
    var attr = document.documentElement.getAttribute("data-theme");
    if(attr) return attr;
    return (window.matchMedia && window.matchMedia("(prefers-color-scheme:dark)").matches) ? "dark":"light";
  }
  function toggleTheme(){
    var next = currentTheme()==="dark" ? "light":"dark";
    document.documentElement.setAttribute("data-theme", next);
    try{ localStorage.setItem("theme", next); }catch(e){}
  }
  try{ var savedT = localStorage.getItem("theme"); if(savedT) document.documentElement.setAttribute("data-theme", savedT); }catch(e){}

  render();
})();
</script>

</body></html>
